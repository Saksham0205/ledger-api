services:
  - type: web
    name: ledger-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
